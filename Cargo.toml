[package]
name = "gray-maker"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Scaffold, build, release and publish gray plugins"

[lib]
name = "gray_maker"
path = "src/lib.rs"

[[bin]]
name = "gray-maker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
